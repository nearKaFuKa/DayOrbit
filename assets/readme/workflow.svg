<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="title desc">
  <title id="title">Three views, one connected workspace</title>
  <desc id="desc">Project whiteboards help you think and connect; the Today board helps you choose and finish; the material library helps you collect and reuse. Project and daily views share task records. Materials are separate records.</desc>
  <rect width="1200" height="304" rx="20" fill="#f4f2ec"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="projects" transform="translate(48 38)">
      <text x="0" y="25" fill="#3554d1" font-size="20" font-weight="600">01 / PROJECTS</text>
      <text x="0" y="77" fill="#1f1e1b" font-size="34" font-weight="600" letter-spacing="-.7">Think &amp; connect.</text>
      <path d="M35 142 H92 M92 142 C123 142 120 116 150 116 M92 142 C123 142 120 169 150 169" fill="none" stroke="#a4aac0" stroke-width="2"/>
      <rect x="0" y="125" width="70" height="34" rx="7" fill="#fff" stroke="#cfcbc0"/>
      <rect x="150" y="99" width="70" height="34" rx="7" fill="#fff" stroke="#cfcbc0"/>
      <rect x="150" y="152" width="70" height="34" rx="7" fill="#fff" stroke="#cfcbc0"/>
      <path d="M16 142 H50 M166 116 H200 M166 169 H200" stroke="#3554d1" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M422 38 V225 M808 38 V225" stroke="#dedbd2"/>
    <g id="today" transform="translate(458 38)">
      <text x="0" y="25" fill="#3554d1" font-size="20" font-weight="600">02 / TODAY</text>
      <text x="0" y="77" fill="#1f1e1b" font-size="34" font-weight="600" letter-spacing="-.7">Choose &amp; finish.</text>
      <rect x="0" y="105" width="260" height="77" rx="10" fill="#3554d1"/>
      <rect x="20" y="128" width="28" height="28" rx="6" fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M27 141 L33 147 L42 136" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="150" fill="#fff" font-size="23" font-weight="500">One next step</text>
    </g>
    <g id="materials" transform="translate(844 38)">
      <text x="0" y="25" fill="#3554d1" font-size="20" font-weight="600">03 / MATERIALS</text>
      <text x="0" y="77" fill="#1f1e1b" font-size="34" font-weight="600" letter-spacing="-.7">Collect &amp; reuse.</text>
      <rect x="0" y="105" width="120" height="77" rx="9" fill="#fff" stroke="#cfcbc0"/>
      <rect x="134" y="105" width="120" height="53" rx="9" fill="#fff" stroke="#cfcbc0"/>
      <path d="M17 126 H79 M17 141 H102 M17 156 H64 M151 126 H209 M151 141 H228" stroke="#a4aac0" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="48" y="271" fill="#4a4842" font-size="20">Project + daily views share one task. Your reference material stays in its own library.</text>
  </g>
</svg>
